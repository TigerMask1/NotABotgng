name: YouTube Automation Pipeline

on:
  schedule:
    # Run once a day at 10:00 UTC (3:30pm IST)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ytautomation/requirements.txt
          
      - name: Create .env file from secrets
        run: |
          cat > ytautomation/.env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NOTABOT_SUPABASE_URL=${{ secrets.NOTABOT_SUPABASE_URL }}
          NOTABOT_SUPABASE_SERVICE_KEY=${{ secrets.NOTABOT_SUPABASE_SERVICE_KEY }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCORD_SERVER_INVITE=${{ secrets.DISCORD_SERVER_INVITE }}
          EOF
          
      - name: Run Pipeline & Upload to YouTube
        run: |
          cd ytautomation/scripts
          python daily_pipeline.py --shorts-only
          
          # Upload each generated short to YouTube
          OUTPUT_DIR="../output/$(date +%Y-%m-%d)"
          echo "Looking for shorts in $OUTPUT_DIR"
          
          for i in 01 02 03 04 05; do
            VIDEO="$OUTPUT_DIR/short_${i}.mp4"
            SCRIPT="$OUTPUT_DIR/short_${i}_script.txt"
            if [ -f "$VIDEO" ]; then
              echo "Uploading short_${i}..."
              python -c "
          import sys, os
          sys.path.insert(0, '.')
          from upload_youtube import upload_video
          upload_video(
              video_path='$VIDEO',
              script_path='$SCRIPT' if os.path.exists('$SCRIPT') else None
          )
          "
            else
              echo "short_${i}.mp4 not found, skipping."
            fi
          done
          
      - name: Upload Output as Artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-${{ github.run_id }}
          path: ytautomation/output/
          retention-days: 3
